<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VoxelWeb</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #eee; font-family: monospace; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 190px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }

    button {
      background: #222;
      border: 1px solid #555;
      color: #eee;
      padding: 6px 14px;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
    }
    button:hover { background: #333; }
    button:disabled { opacity: 0.4; cursor: default; }

    #status {
      font-size: 12px;
      color: #aaa;
      padding: 2px 0;
    }

    hr { border: none; border-top: 1px solid #333; margin: 2px 0; }

    .ctrl-group { display: flex; flex-direction: column; gap: 3px; }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ctrl-label { font-size: 11px; color: #888; }
    .ctrl-val   { font-size: 11px; color: #bbb; min-width: 28px; text-align: right; }

    select {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #444;
      color: #ddd;
      font-family: monospace;
      font-size: 11px;
      padding: 3px 4px;
      cursor: pointer;
    }
    select:hover { border-color: #666; }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
      accent-color: #5af;
      height: 16px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .check-row input { cursor: pointer; accent-color: #5af; }
    .check-row span  { font-size: 11px; color: #888; }

    #no-webgpu {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #111;
      font-size: 18px;
      color: #f66;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="ui">
    <button id="load-btn">Load GLB</button>
    <input type="file" id="file-input" accept=".glb" style="display:none">
    <div id="status">Drop a GLB or click Load</div>

    <hr>

    <!-- Resolution (requires re-voxelization) -->
    <div class="ctrl-group">
      <div class="ctrl-row">
        <span class="ctrl-label">Resolution</span>
      </div>
      <select id="resolution">
        <option value="32">32</option>
        <option value="64" selected>64</option>
        <option value="96">96</option>
        <option value="128">128</option>
        <option value="192">192</option>
      </select>
    </div>

    <!-- Palette -->
    <div class="ctrl-group">
      <div class="ctrl-row">
        <span class="ctrl-label">Palette</span>
      </div>
      <select id="palette">
        <option value="0">Full 565</option>
        <option value="1">PICO-8</option>
        <option value="2">C64</option>
        <option value="3">EGA</option>
        <option value="4">Gray 8</option>
        <option value="5">Gray 32</option>
        <option value="6">Web 216</option>
      </select>
    </div>

    <!-- Metallic -->
    <div class="ctrl-group">
      <div class="ctrl-row">
        <span class="ctrl-label">Metallic</span>
        <span class="ctrl-val" id="metallic-val">0.00</span>
      </div>
      <input type="range" id="metallic" min="0" max="1" step="0.01" value="0">
    </div>

    <!-- Smoothness -->
    <div class="ctrl-group">
      <div class="ctrl-row">
        <span class="ctrl-label">Smoothness</span>
        <span class="ctrl-val" id="smoothness-val">0.30</span>
      </div>
      <input type="range" id="smoothness" min="0" max="1" step="0.01" value="0.3">
    </div>

    <!-- Ambient -->
    <div class="ctrl-group">
      <div class="ctrl-row">
        <span class="ctrl-label">Ambient</span>
        <span class="ctrl-val" id="ambient-val">0.25</span>
      </div>
      <input type="range" id="ambient" min="0" max="1" step="0.01" value="0.25">
    </div>

    <!-- Emissive -->
    <label class="check-row">
      <input type="checkbox" id="emissive">
      <span>Emissive</span>
    </label>
  </div>

  <div id="no-webgpu">WebGPU not supported in this browser.</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
