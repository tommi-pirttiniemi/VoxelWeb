<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VoxelWeb</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #eee; font-family: monospace; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }

    button {
      background: #222;
      border: 1px solid #555;
      color: #eee;
      padding: 6px 14px;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
    }
    button:hover { background: #333; }
    button:disabled { opacity: 0.4; cursor: default; }

    #status {
      font-size: 12px;
      color: #aaa;
      padding: 4px 0;
    }

    #no-webgpu {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #111;
      font-size: 18px;
      color: #f66;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="ui">
    <button id="load-btn">Load GLB</button>
    <input type="file" id="file-input" accept=".glb" style="display:none">
    <div id="status">Drop a GLB or click Load</div>
  </div>

  <div id="no-webgpu">WebGPU not supported in this browser.</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
